name: CI Gate

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs, but let pushes to main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Sync dependencies
        run: just install-dev

      - name: Lint & Format
        run: just lint

  test:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Sync dependencies
        run: just install-dev

      - name: Run unit tests
        run: just test

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          python-version: "3.14"

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Install TeX Live
        run: |
          curl -fsSL -o install-tl-unx.tar.gz https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
          mkdir install-tl
          tar xzf install-tl-unx.tar.gz -C install-tl --strip-components=1
          perl install-tl/install-tl --no-interaction --scheme=basic \
            --texdir="$HOME/texlive" --texuserdir="$HOME/.texlive"
          echo "$HOME"/texlive/bin/* >> "$GITHUB_PATH"

      - name: Install LaTeX packages
        run: tlmgr install latexmk pgf tikz-3dplot pgfplots hobby

      - name: Sync dependencies
        run: just install-dev

      - name: Run integration tests
        shell: bash
        run: just test-integration
